<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPM Estudio Automotriz — Catálogo de Servicios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde: #101E19;
    --verde2: #1B3A2D;
    --crema: #F1EEE4;
    --crema-dim: #ADA89A;
    --rojo: #D94F30;
    --linea: rgba(241,238,228,0.12);
    --linea-fuerte: rgba(241,238,228,0.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: var(--verde);
    color: var(--crema);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -8%, rgba(217,79,48,0.09), transparent 60%),
      radial-gradient(ellipse 800px 600px at 105% 10%, rgba(241,238,228,0.045), transparent 55%),
      var(--verde);
  }
  .wrap{ max-width: 540px; margin:0 auto; padding: 0 0 70px; }

  header.hero{
    padding: 44px 26px 30px;
    text-align:center;
    position:relative;
    border-bottom: 1px solid var(--linea);
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--linea) 1px, transparent 1px),
      linear-gradient(90deg, var(--linea) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity:0.35;
    mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 10%, transparent 75%);
    pointer-events:none;
  }
  .hero-240z{
    position:absolute;
    left:50%;
    top:58%;
    width: 130%;
    max-width:900px;
    transform: translate(-50%,-50%) scaleX(-1);
    opacity: 0.10;
    filter: blur(2.5px);
    pointer-events:none;
    z-index:0;
  }
  .corner-logo{
    position:absolute;
    top:16px;
    right:16px;
    height: 22px;
    opacity:0.92;
    z-index:2;
  }
  .hero-inner{ position:relative; z-index:1; }
  .logo-word{ font-size: 13px; letter-spacing: 0.32em; font-weight:600; color: var(--crema-dim); }
  .logo-word .m{ color: var(--rojo); }
  h1.brand{ margin-top:14px; font-size: 34px; font-weight:700; letter-spacing:-0.01em; line-height:1.12; }
  .tagline{ margin-top:10px; font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--crema-dim); }
  .loc{
    margin-top: 18px; display:inline-flex; align-items:center; gap:8px;
    font-size: 10.5px; font-family:'IBM Plex Mono', monospace; color: var(--crema-dim);
    letter-spacing:0.06em; border: 1px solid var(--linea-fuerte); padding: 6px 14px;
  }
  .loc .dot{ width:5px; height:5px; background:var(--rojo); border-radius:50%; }

  /* STICKY CONTROL BAR */
  .controlbar{
    position: sticky; top:0; z-index: 30;
    background: rgba(16,30,25,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linea);
  }

  nav.quicknav{ padding: 12px 16px 8px; display:flex; gap: 6px; }
  .navlink{
    flex:1; text-align:center; font-family:'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing:0.03em; text-decoration:none; padding: 9px 6px; color: var(--crema-dim);
    border: 1px solid var(--linea); background:none; cursor:pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .navlink.active{ color: var(--verde); background: var(--crema); border-color: var(--crema); }

  .surcharge-row{
    padding: 2px 16px 12px;
    display:flex;
    justify-content:flex-end;
  }
  .surcharge-chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:none;
    border: 1px solid var(--linea-fuerte);
    color: var(--crema-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing:0.02em;
    padding: 6px 10px;
    cursor:pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .surcharge-chip .dot{
    width:7px; height:7px;
    border-radius:50%;
    border: 1px solid var(--crema-dim);
    flex:0 0 auto;
    transition: background .15s ease, border-color .15s ease;
  }
  .surcharge-chip.on{ color: var(--rojo); border-color: rgba(217,79,48,0.55); background: rgba(217,79,48,0.08); }
  .surcharge-chip.on .dot{ background: var(--rojo); border-color: var(--rojo); }

  section.group{ padding: 0 20px; display:none; }
  section.group.active{ display:block; }

  .group-head{ padding: 32px 4px 18px; display:flex; align-items:baseline; gap: 14px; }
  .group-head .idx{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--rojo); letter-spacing:0.05em; }
  .group-head .titles{ flex:1; }
  .group-title{ font-size: 22px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .group-desc{ margin-top:4px; font-size: 12.5px; color: var(--crema-dim); line-height:1.4; }
  .group-rule{ height:1px; background: var(--linea-fuerte); margin: 0 4px 22px; }

  .cards{ display:flex; flex-direction:column; gap:18px; }

  .card{
    border: 1px solid var(--linea);
    background: linear-gradient(180deg, rgba(241,238,228,0.025), transparent 45%);
    box-shadow: 0 18px 34px -22px rgba(0,0,0,0.65);
    transition: border-color .2s ease;
  }
  .card:hover{ border-color: var(--linea-fuerte); }

  .visual{ position:relative; height: 208px; overflow:hidden; border-bottom: 1px solid var(--linea); background: var(--verde2); }
  .visual svg, .visual img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .visual .veil{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(16,30,25,0) 40%, rgba(16,30,25,0.75) 100%); }
  .visual .price-tag{
    position:absolute; right:12px; bottom:12px; font-family:'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing:0.02em; color: var(--crema); background: rgba(16,30,25,0.55);
    border: 1px solid var(--linea-fuerte); padding: 5px 10px; transition: opacity .15s ease;
  }
  .visual .price-tag.cta{ color: var(--rojo); border-color: rgba(217,79,48,0.55); }
  .visual .cat-tag{
    position:absolute; left:12px; top:12px; font-family:'IBM Plex Mono', monospace; font-size: 9.5px;
    letter-spacing:0.09em; text-transform:uppercase; color: var(--crema-dim);
    background: rgba(16,30,25,0.55); padding: 4px 8px; border: 1px solid var(--linea);
  }

  .card-body{ padding: 18px 18px 4px; }
  .card-title{ font-size: 19px; font-weight:700; text-transform:uppercase; letter-spacing:0.01em; line-height:1.25; }
  .card-sub{ margin-top:6px; font-size: 13px; color: var(--crema-dim); line-height:1.5; }

  .toggle{
    margin-top: 16px; width:100%; background:none; border:none; border-top: 1px solid var(--linea);
    padding: 13px 0 0; color: var(--crema); font-family:'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing:0.05em; display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .toggle .arrow{ transition: transform .2s ease; color: var(--rojo); font-size:14px; }
  .card.open .toggle .arrow{ transform: rotate(90deg); }

  .items{ max-height:0; overflow:hidden; transition: max-height .28s ease; padding: 0 18px; }
  .card.open .items{ padding-bottom: 10px; }
  .items ul{ list-style:none; padding-top: 12px; }
  .items li{ font-size: 13px; line-height:1.6; padding-left: 15px; position:relative; color: rgba(241,238,228,0.88); }
  .items li + li{ margin-top:2px; }
  .items li::before{ content:""; position:absolute; left:0; top:9px; width:6px; height:1px; background: var(--rojo); }
  .items .note{ margin-top:12px; font-size:11.5px; color: var(--crema-dim); font-style:italic; border-left: 2px solid var(--rojo); padding-left: 10px; }

  .cta-row{ padding: 16px 18px 18px; }
  .btn-wa{
    display:block; text-align:center; text-decoration:none; background: var(--crema); color: var(--verde);
    font-weight:600; font-size: 13px; letter-spacing:0.02em; padding: 13px 10px; border: 1px solid var(--crema);
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-wa:active{ background: var(--rojo); border-color:var(--rojo); color: var(--crema); }

  footer{ margin-top: 46px; padding: 30px 24px 14px; text-align:center; border-top: 1px solid var(--linea); }
  footer .foot-brand{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing:0.08em; color: var(--crema-dim); }
  footer .foot-brand .m{ color: var(--rojo); }
  footer .socials{ margin-top:10px; font-size: 11px; color: var(--crema-dim); }
  footer .whatsapp-cta{
    margin-top:18px; display:inline-block; font-family:'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing:0.03em; color: var(--rojo); text-decoration:none; border-bottom: 1px solid rgba(217,79,48,0.4); padding-bottom:2px;
  }
</style>
</head>

const root = document.getElementById('groupsRoot');
const waBase = `https://wa.me/${WHATSAPP_NUMBER}`;
document.getElementById('footerWa').href = `${waBase}?text=${encodeURIComponent("Hola RPM Estudio Automotriz! Quisiera más información sobre sus servicios.")}`;

let surchargeOn = false;

function formatPrice(service){
  if(service.cta) return "Cotiza tu servicio";
  const mult = surchargeOn ? (1 + LARGE_VEHICLE_SURCHARGE) : 1;
  const value = service.price * mult;
  const formatted = Number.isInteger(Math.round(value * 100) / 100) ? value.toFixed(0) : value.toFixed(2);
  return `$${formatted}`;
}

['proteccion','detallados','restauracion'].forEach(groupId => {
  const meta = groupMeta[groupId];
  const groupServices = services.filter(s => s.group === groupId);

  const section = document.createElement('section');
  section.className = 'group';
  section.id = meta.id;

  const cardsHtml = groupServices.map(s => {
    const priceTagHtml = s.cta
      ? `<div class="price-tag cta">Cotiza tu servicio</div>`
      : `<div class="price-tag" data-service="${s.id}">${formatPrice(s)}</div>`;
    const noteHtml = s.note ? `<div class="note">${s.note}</div>` : "";
    const waMsg = encodeURIComponent(`Hola RPM Estudio Automotriz! Quiero más información sobre el servicio de ${s.title}.`);
    const visualInner = s.image
      ? `<img src="${s.image}" alt="${s.title}">`
      : `<svg viewBox="0 0 500 168" preserveAspectRatio="xMidYMid slice">${icons[s.icon] || ""}</svg>`;

    return `
      <div class="card" data-id="${s.id}">
        <div class="visual">
          ${visualInner}
          <div class="veil"></div>
          <div class="cat-tag">${s.catLabel}</div>
          ${priceTagHtml}
        </div>
        <div class="card-body">
          <div class="card-title">${s.title}</div>
          <div class="card-sub">${s.sub}</div>
        </div>
        <button class="toggle">
          <span>VER QUÉ INCLUYE</span>
          <span class="arrow">›</span>
        </button>
        <div class="items">
          <ul>${s.items.map(i => `<li>${i}</li>`).join('')}</ul>
          ${noteHtml}
        </div>
        <div class="cta-row">
          <a class="btn-wa" target="_blank" rel="noopener" href="${waBase}?text=${waMsg}">Consultar por WhatsApp</a>
        </div>
      </div>
    `;
  }).join('');

  section.innerHTML = `
    <div class="group-head">
      <div class="idx">${meta.idx}</div>
      <div class="titles">
        <div class="group-title">${meta.title}</div>
        <div class="group-desc">${meta.desc}</div>
      </div>
    </div>
    <div class="group-rule"></div>
    <div class="cards">${cardsHtml}</div>
  `;

  root.appendChild(section);
});

// Accordion toggles
root.addEventListener('click', (e) => {
  const btn = e.target.closest('.toggle');
  if(!btn) return;
  const card = btn.closest('.card');
  card.classList.toggle('open');
  const itemsEl = card.querySelector('.items');
  itemsEl.style.maxHeight = card.classList.contains('open') ? itemsEl.scrollHeight + 40 + "px" : "0px";
});

// Group tabs (interactive switching)
const navlinks = document.querySelectorAll('.navlink');
const groupSections = document.querySelectorAll('section.group');
function setActiveGroup(groupId){
  navlinks.forEach(l => l.classList.toggle('active', l.dataset.target === groupId));
  groupSections.forEach(s => s.classList.toggle('active', s.id === groupId));
}
document.getElementById('quicknav').addEventListener('click', (e) => {
  const btn = e.target.closest('.navlink');
  if(!btn) return;
  setActiveGroup(btn.dataset.target);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
setActiveGroup('proteccion');

// Large-vehicle surcharge chip (+15%)
const surchargeSwitch = document.getElementById('surchargeSwitch');
surchargeSwitch.addEventListener('click', () => {
  surchargeOn = !surchargeOn;
  surchargeSwitch.classList.toggle('on', surchargeOn);
  surchargeSwitch.setAttribute('aria-pressed', String(surchargeOn));
  services.forEach(s => {
    if(s.cta) return;
    const tag = document.querySelector(`.price-tag[data-service="${s.id}"]`);
    if(tag) tag.textContent = formatPrice(s);
  });
});
