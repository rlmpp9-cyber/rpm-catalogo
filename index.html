<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101E19" />
  <meta name="description" content="Catálogo de servicios de RPM Estudio Automotriz — Cuenca, Ecuador." />
  <title>RPM Estudio Automotriz — Catálogo de servicios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101E19;
      --bg-2: #12211C;
      --panel: rgba(18, 33, 28, 0.92);
      --panel-strong: #152720;
      --cream: #F1EEE4;
      --muted: rgba(241, 238, 228, 0.67);
      --line: rgba(241, 238, 228, 0.14);
      --line-strong: rgba(241, 238, 228, 0.24);
      --accent: #D94F30;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      --radius: 22px;
      --radius-sm: 14px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      background:
        radial-gradient(circle at 8% -10%, rgba(217, 79, 48, 0.08), transparent 28rem),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 28%, #0d1915 100%);
      font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    img { display: block; max-width: 100%; }

    .site-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 0 16px 72px;
    }

    .hero {
      position: relative;
      min-height: 260px;
      margin: 0 -16px;
      padding: 28px 18px 32px;
      overflow: hidden;
      isolation: isolate;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(16, 30, 25, 0.82), rgba(16, 30, 25, 0.96)),
        radial-gradient(circle at 78% 8%, rgba(241, 238, 228, 0.04), transparent 24rem);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: url("images/rpm_240z_crema.png") center 74% / min(780px, 112vw) auto no-repeat;
      opacity: 0.065;
      filter: blur(0.25px);
      transform: scale(1.04);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 1px;
      z-index: -1;
      background: linear-gradient(90deg, transparent, rgba(217, 79, 48, 0.55), transparent);
    }

    .brand-mark {
      width: 88px;
      height: auto;
      margin-left: auto;
      opacity: 0.96;
    }

    .eyebrow,
    .service-category,
    .price,
    .special-label,
    .size-kicker,
    .tab-index {
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.055em;
    }

    .eyebrow {
      margin: 42px 0 12px;
      color: var(--muted);
      font-size: 0.73rem;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 10vw, 5.4rem);
      line-height: 0.94;
      letter-spacing: -0.055em;
      font-weight: 600;
    }

    .tagline {
      max-width: 650px;
      margin: 18px 0 0;
      color: rgba(241, 238, 228, 0.83);
      font-size: clamp(1rem, 4.4vw, 1.2rem);
      line-height: 1.5;
    }

    .red-dot {
      display: inline-block;
      width: 0.42em;
      height: 0.42em;
      margin-right: 0.38em;
      border-radius: 999px;
      background: var(--accent);
      vertical-align: 0.08em;
    }

    .sticky-ui {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px;
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 30, 25, 0.9);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.12);
    }

    .size-selector {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .size-kicker {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .size-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .size-button,
    .tab-button {
      border: 1px solid var(--line);
      background: rgba(241, 238, 228, 0.025);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .size-button {
      min-height: 48px;
      padding: 8px 7px;
      border-radius: 11px;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.18;
      text-align: center;
    }

    .size-button[aria-pressed="true"] {
      color: var(--cream);
      border-color: rgba(241, 238, 228, 0.38);
      background: rgba(241, 238, 228, 0.095);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .tab-button {
      position: relative;
      min-height: 56px;
      padding: 8px 6px;
      border-radius: 11px;
      color: var(--muted);
      font-size: 0.67rem;
      line-height: 1.16;
      text-align: left;
    }

    .tab-index {
      display: block;
      margin-bottom: 3px;
      color: rgba(241, 238, 228, 0.48);
      font-size: 0.62rem;
    }

    .tab-button[aria-selected="true"] {
      color: var(--cream);
      border-color: var(--line-strong);
      background: rgba(241, 238, 228, 0.08);
    }

    .tab-button[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -1px;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    .content {
      padding-top: 24px;
    }

    .group-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 16px;
    }

    .group-heading h2 {
      margin: 0;
      font-size: clamp(1.35rem, 6vw, 2.3rem);
      line-height: 1;
      letter-spacing: -0.035em;
      font-weight: 500;
    }

    .group-rule {
      width: 38px;
      height: 2px;
      margin-bottom: 5px;
      flex: 0 0 auto;
      background: var(--accent);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .service-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(23, 42, 35, 0.95), rgba(18, 33, 28, 0.97));
      box-shadow: var(--shadow);
    }

    .photo-wrap {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #0a1511;
    }

    .photo-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(4, 10, 8, 0.04) 0%, rgba(4, 10, 8, 0.14) 54%, rgba(4, 10, 8, 0.72) 100%),
        linear-gradient(90deg, rgba(16, 30, 25, 0.12), transparent 55%);
      pointer-events: none;
    }

    .service-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.82) contrast(1.08) brightness(0.82);
      transform: scale(1.005);
    }

    .photo-meta {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 2;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
    }

    .special-label {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 8px;
      border: 1px solid rgba(241, 238, 228, 0.26);
      border-radius: 999px;
      color: var(--cream);
      background: rgba(16, 30, 25, 0.74);
      backdrop-filter: blur(10px);
      font-size: 0.62rem;
      text-transform: uppercase;
    }

    .special-label::before {
      content: "";
      width: 5px;
      height: 5px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .card-body { padding: 18px; }

    .service-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .service-category {
      color: var(--muted);
      font-size: 0.66rem;
      text-transform: uppercase;
    }

    .price {
      flex: 0 0 auto;
      color: var(--cream);
      font-size: clamp(1.12rem, 5vw, 1.48rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      text-align: right;
      white-space: nowrap;
    }

    .price.quote {
      max-width: 145px;
      white-space: normal;
      font-size: 0.84rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .service-title {
      margin: 0;
      font-size: clamp(1.45rem, 6vw, 2.05rem);
      line-height: 1.03;
      letter-spacing: -0.04em;
      font-weight: 600;
    }

    .service-subtitle {
      min-height: 1.4em;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    details {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      cursor: pointer;
      list-style: none;
      font-size: 0.88rem;
      font-weight: 500;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: "+";
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--cream);
      font-family: "IBM Plex Mono", monospace;
      font-size: 1rem;
      font-weight: 400;
      transition: transform 160ms ease;
    }

    details[open] summary::after { transform: rotate(45deg); }

    .includes {
      margin: 0;
      padding: 0 0 14px;
      list-style: none;
    }

    .includes li {
      position: relative;
      padding: 8px 0 8px 17px;
      color: rgba(241, 238, 228, 0.79);
      border-top: 1px solid rgba(241, 238, 228, 0.07);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .includes li::before {
      content: "";
      position: absolute;
      left: 1px;
      top: 15px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 49px;
      width: 100%;
      margin-top: 18px;
      padding: 11px 16px;
      border: 1px solid rgba(241, 238, 228, 0.28);
      border-radius: 12px;
      color: var(--cream);
      background: rgba(241, 238, 228, 0.055);
      text-decoration: none;
      font-weight: 600;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .whatsapp::after {
      content: "↗";
      margin-left: 9px;
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
    }

    .whatsapp:hover,
    .whatsapp:focus-visible {
      background: rgba(241, 238, 228, 0.105);
      border-color: rgba(241, 238, 228, 0.45);
      transform: translateY(-1px);
      outline: none;
    }

    .footer {
      padding: 38px 4px 0;
      color: rgba(241, 238, 228, 0.48);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      line-height: 1.6;
      text-align: center;
    }

    @media (min-width: 680px) {
      .site-shell { padding-inline: 24px; }
      .hero { margin-inline: -24px; padding: 34px 28px 42px; min-height: 340px; }
      .sticky-ui { margin-inline: -24px; padding-inline: 24px; }
      .size-selector { grid-template-columns: auto minmax(0, 620px); align-items: center; justify-content: space-between; }
      .size-options { min-width: 560px; }
      .size-button { font-size: 0.74rem; }
      .tab-button { min-height: 62px; padding: 10px 12px; font-size: 0.76rem; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-body { padding: 20px; }
    }

    @media (min-width: 980px) {
      .site-shell { padding-inline: 32px; }
      .hero { margin-inline: -32px; padding: 38px 42px 48px; border-radius: 0 0 28px 28px; }
      .hero::before { background-position: 88% 66%; background-size: min(760px, 58vw) auto; }
      .eyebrow { margin-top: 68px; }
      .sticky-ui { top: 12px; margin: 18px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 18px; }
      .content { padding-top: 34px; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .service-card { transition: transform 180ms ease, border-color 180ms ease; }
      .service-card:hover { transform: translateY(-3px); border-color: rgba(241, 238, 228, 0.24); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="site-shell">
    <header class="hero">
      <img class="brand-mark" src="images/rpm_mark_only_crema.png" alt="RPM" />
      <p class="eyebrow"><span class="red-dot"></span>Cuenca, Ecuador</p>
      <h1>RPM Estudio Automotriz</h1>
      <p class="tagline">Preservamos vehículos. Perpetuamos historias.</p>
    </header>

    <section class="sticky-ui" aria-label="Filtros del catálogo">
      <div class="size-selector" aria-label="Tamaño del vehículo">
        <span class="size-kicker">Tamaño del vehículo</span>
        <div class="size-options" role="group" aria-label="Selecciona el tamaño del vehículo">
          <button class="size-button" type="button" data-size="auto" aria-pressed="true">Autos y crossovers</button>
          <button class="size-button" type="button" data-size="suv" aria-pressed="false">SUV / Camioneta pequeña</button>
          <button class="size-button" type="button" data-size="camioneta" aria-pressed="false">SUV grande / Camioneta grande</button>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Grupos de servicios">
        <button class="tab-button" type="button" role="tab" aria-selected="true" data-group="proteccion">
          <span class="tab-index">01</span>Protección y brillo
        </button>
        <button class="tab-button" type="button" role="tab" aria-selected="false" data-group="detallados">
          <span class="tab-index">02</span>Detallados
        </button>
        <button class="tab-button" type="button" role="tab" aria-selected="false" data-group="restauracion">
          <span class="tab-index">03</span>Restauración y pintura
        </button>
      </nav>
    </section>

    <section class="content" id="catalog-content" aria-live="polite"></section>

    <footer class="footer">RPM Estudio Automotriz · Cuenca, Ecuador</footer>
  </main>

  <script>
    const services = [
      {
        id: 1,
        group: "proteccion",
        category: "Protección y brillo",
        title: "Pulido de faros",
        subtitle: "Claridad, acabado y protección para recuperar la presencia del conjunto óptico.",
        image: "images/faros.jpg",
        priceType: "fixed",
        price: 29.99,
        items: ["Lijado progresivo", "Pulido en 3 etapas", "Sellador repelente"]
      },
      {
        id: 2,
        group: "proteccion",
        category: "Protección y brillo",
        title: "Corrección de brillo y pulida",
        subtitle: "Corrección estética de la pintura con protección hidrorepelente de larga duración.",
        image: "images/brillo.jpg",
        priceType: "table",
        prices: { auto: 90, suv: 110, camioneta: 140 },
        items: [
          "Prelavado",
          "Lijado progresivo",
          "Pulido en 3 etapas",
          "Cera hidrorepelente (protección 1 año)",
          "Limpieza interior estándar",
          "Limpieza exterior",
          "Restauración de neumáticos y plásticos externos",
          "Limpieza de vidrios + repelencia"
        ]
      },
      {
        id: 3,
        group: "proteccion",
        category: "Protección y brillo",
        title: "Cerámico 3 años",
        subtitle: "Preparación de superficie y coating cerámico para protección y profundidad de brillo.",
        image: "images/ceramico.jpg",
        priceType: "table",
        prices: { auto: 180, suv: 220, camioneta: 260 },
        items: [
          "Prelavado y descontaminación",
          "Pulido",
          "Coating cerámico 3 años",
          "Limpieza interior estándar",
          "Limpieza exterior",
          "Restauración de neumáticos y plásticos externos",
          "Limpieza de vidrios + repelencia"
        ]
      },
      {
        id: 4,
        group: "detallados",
        category: "Detallados",
        title: "Servicio RPM",
        subtitle: "Cuidado esencial interior y exterior para mantener el vehículo impecable.",
        image: "images/limpieza.jpg",
        priceType: "fixed",
        price: 34.99,
        items: [
          "Prelavado y descontaminación",
          "Lavado de contacto",
          "Cera líquida 3 meses",
          "Limpieza interior estándar",
          "Revitalización de neumáticos y plásticos externos",
          "Limpieza de vidrios"
        ]
      },
      {
        id: 5,
        group: "detallados",
        category: "Detallados",
        title: "Detallado de interiores",
        subtitle: "Limpieza profunda, descontaminación y protección de las superficies del habitáculo.",
        image: "images/interiores.jpg",
        priceType: "table",
        prices: { auto: 84.99, suv: 102.99, camioneta: 121.99 },
        items: [
          "Lavado exterior estándar + restauración de neumáticos",
          "Descontaminación y limpieza detallada de asientos, alfombra, tapizados, tablero y consolas",
          "Revitalización de plásticos y paneles + protección UV"
        ]
      },
      {
        id: 6,
        group: "detallados",
        category: "Detallados",
        title: "Detallado completo",
        subtitle: "Tratamiento integral de interior, exterior, vidrios y compartimiento de motor.",
        image: "images/premium.jpg",
        label: "RPM Premium",
        priceType: "table",
        prices: { auto: 144.99, suv: 167.99, camioneta: 199.99 },
        items: [
          "Servicio exterior completo",
          "Detallado interior integral",
          "Descontaminación de vidrios + hidrorepelencia",
          "Detallado de motor completo + restaurador de plásticos alta temperatura"
        ]
      },
      {
        id: 7,
        group: "detallados",
        category: "Detallados",
        title: "Detallado completo + Corrección de brillo",
        subtitle: "La experiencia de detallado completo combinada con corrección de brillo y protección.",
        image: "images/brillo.jpg",
        label: "Combo — mejor valor",
        priceType: "combo",
        combo: { serviceIds: [6, 2], discount: 0.20 },
        items: [
          "Servicio exterior completo",
          "Detallado interior integral",
          "Descontaminación de vidrios + hidrorepelencia",
          "Detallado de motor completo + restaurador de plásticos alta temperatura",
          "Prelavado",
          "Lijado progresivo",
          "Pulido en 3 etapas",
          "Cera hidrorepelente (protección 1 año)"
        ]
      },
      {
        id: 8,
        group: "detallados",
        category: "Detallados",
        title: "Detallado completo + Cerámico 3 años",
        subtitle: "Detallado integral con preparación y protección cerámica de 3 años.",
        image: "images/ceramico.jpg",
        label: "Combo — mejor valor",
        priceType: "combo",
        combo: { serviceIds: [6, 3], discount: 0.25 },
        items: [
          "Servicio exterior completo",
          "Detallado interior integral",
          "Descontaminación de vidrios + hidrorepelencia",
          "Detallado de motor completo + restaurador de plásticos alta temperatura",
          "Prelavado y descontaminación",
          "Pulido",
          "Coating cerámico 3 años",
          "Restauración de neumáticos y plásticos externos"
        ]
      },
      {
        id: 9,
        group: "restauracion",
        category: "Restauración y pintura",
        title: "Latonería y pintura",
        subtitle: "Evaluación del daño y alcance del trabajo antes de definir el presupuesto.",
        image: "images/pintura.jpg",
        priceType: "quote",
        items: [
          "Cotización previa dependiendo del trabajo a realizar",
          "Presupuesto preliminar con fotos o videos de las zonas afectadas"
        ]
      },
      {
        id: 10,
        group: "restauracion",
        category: "Restauración y pintura",
        title: "Restauración de carrocería",
        subtitle: "Proyectos parciales o completos definidos según alcance, necesidades y presupuesto.",
        image: "images/restauracion.jpg",
        priceType: "quote",
        items: [
          "Restauraciones parciales o completas",
          "Alcance y resultado definidos según el proyecto",
          "Trabajamos en base a tus necesidades y a tu presupuesto",
          "Mejor resultado según relación calidad-precio"
        ]
      }
    ];

    const groupNames = {
      proteccion: "Protección y brillo",
      detallados: "Detallados",
      restauracion: "Restauración y pintura"
    };

    let selectedSize = "auto";
    let selectedGroup = "proteccion";

    function serviceById(id) {
      return services.find(service => service.id === id);
    }

    function rawPrice(service, size) {
      if (service.priceType === "fixed") return service.price;
      if (service.priceType === "table") return service.prices[size];
      if (service.priceType === "combo") {
        const subtotal = service.combo.serviceIds
          .map(serviceById)
          .reduce((sum, baseService) => sum + rawPrice(baseService, size), 0);
        return subtotal * (1 - service.combo.discount);
      }
      return null;
    }

    function formatPrice(service, size) {
      const value = rawPrice(service, size);
      if (value === null) return "Cotiza tu servicio";
      return `$${value.toFixed(2)}`;
    }

    function whatsappLink(service) {
      const message = `Hola RPM Estudio Automotriz, quisiera consultar por el servicio: ${service.title}.`;
      return `https://wa.me/593981042788?text=${encodeURIComponent(message)}`;
    }

    function renderCard(service) {
      const quoteClass = service.priceType === "quote" ? " quote" : "";
      return `
        <article class="service-card">
          <div class="photo-wrap">
            <img class="service-photo" src="${service.image}" alt="${service.title}" loading="lazy" />
            ${service.label ? `<div class="photo-meta"><span class="special-label">${service.label}</span></div>` : ""}
          </div>
          <div class="card-body">
            <div class="service-topline">
              <span class="service-category">${service.category}</span>
              <span class="price${quoteClass}" data-service-price="${service.id}">${formatPrice(service, selectedSize)}</span>
            </div>
            <h3 class="service-title">${service.title}</h3>
            <p class="service-subtitle">${service.subtitle}</p>
            <details>
              <summary>Ver qué incluye</summary>
              <ul class="includes">
                ${service.items.map(item => `<li>${item}</li>`).join("")}
              </ul>
            </details>
            <a class="whatsapp" href="${whatsappLink(service)}" target="_blank" rel="noopener noreferrer">Consultar por WhatsApp</a>
          </div>
        </article>
      `;
    }

    function renderGroup() {
      const content = document.getElementById("catalog-content");
      const visibleServices = services.filter(service => service.group === selectedGroup);
      content.innerHTML = `
        <div class="group-heading">
          <h2>${groupNames[selectedGroup]}</h2>
          <span class="group-rule" aria-hidden="true"></span>
        </div>
        <div class="cards">
          ${visibleServices.map(renderCard).join("")}
        </div>
      `;
    }

    function updateVisiblePrices() {
      document.querySelectorAll("[data-service-price]").forEach(priceNode => {
        const service = serviceById(Number(priceNode.dataset.servicePrice));
        priceNode.textContent = formatPrice(service, selectedSize);
      });
    }

    document.querySelectorAll(".size-button").forEach(button => {
      button.addEventListener("click", () => {
        selectedSize = button.dataset.size;
        document.querySelectorAll(".size-button").forEach(option => {
          option.setAttribute("aria-pressed", String(option === button));
        });
        updateVisiblePrices();
      });
    });

    document.querySelectorAll(".tab-button").forEach(button => {
      button.addEventListener("click", () => {
        selectedGroup = button.dataset.group;
        document.querySelectorAll(".tab-button").forEach(tab => {
          tab.setAttribute("aria-selected", String(tab === button));
        });
        renderGroup();
        const sticky = document.querySelector(".sticky-ui");
        if (window.scrollY > sticky.offsetTop + sticky.offsetHeight) {
          sticky.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });

    renderGroup();
  </script>
</body>
</html>
